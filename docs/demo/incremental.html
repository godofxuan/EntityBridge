<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>EntityBridge · 实测导览</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f1;color:#172b27;font:22px "Microsoft YaHei",sans-serif;padding:65px 80px}h1{font-size:48px;letter-spacing:-1px;line-height:1.3}small{color:#61756d}p{line-height:1.7}section{background:white;border:1px solid #dce4df;border-radius:15px;padding:30px;margin:25px 0}.row{display:flex;gap:25px}.row section{flex:1}b{color:#196654}.badge{color:#196654;letter-spacing:3px;font-size:17px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #e0e7e2;padding:17px 10px;font-size:22px}.foot{font-size:17px;color:#64766f}h2{font-size:26px}</style><body><span class="badge">ENTITYBRIDGE / 05 / 固定策略的增量回放</span><h1>少算变化的部分，<br>结果与全量逐项核对。</h1><p>10k 真实记录 + 明确标记的合成变更，固定模型与训练 TF。</p><section><table><tr><th>变更</th><th>受影响记录</th><th>实际重评配对</th><th>增量 / 全量</th></tr><tr><td>更名</td><td>2</td><td>1</td><td>0.367 / 1.118 s</td></tr><tr><td>删除</td><td>2</td><td>0</td><td>0.069 / 1.156 s</td></tr><tr><td>插入</td><td>3</td><td>1</td><td>0.295 / 1.225 s</td></tr></table></section><p>全部分区相同，每对分数差 ≤ 1e-12。<br>旧新候选、被拒绝边与替代路径都进入影响闭包；超预算则全量兜底。</p><p class="foot">单次实测，不是普遍加速倍数。仍扫描记录找桶并读取版本文件；不宣称完整 I/O 次线性。另有 450 组独立小图 oracle 校验。</p></body></html>
