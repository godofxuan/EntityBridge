[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "entitybridge"
version = "0.2.0"
description = "Evidence-preserving company entity resolution and reversible identity governance"
requires-python = ">=3.12,<3.14"
dependencies = [
  "splink>=4.0.17,<5", "duckdb>=1.4,<2", "pandas>=2.2,<4",
  "pyarrow>=19", "rapidfuzz>=3.10", "scikit-learn>=1.6",
  "sqlalchemy>=2.0,<3", "alembic>=1.14", "psycopg[binary]>=3.2",
  "fastapi>=0.115", "uvicorn>=0.34", "jinja2>=3.1", "python-multipart>=0.0.20",
  "httpx>=0.28", "psutil>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "hypothesis>=6.125", "ruff>=0.11"]

[project.scripts]
entitybridge = "entitybridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
entitybridge = ["web/templates/*.html", "web/static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["postgres: requires a PostgreSQL database", "network: downloads public source data"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]
